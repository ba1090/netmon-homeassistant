[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    stress: prove di carico e di durata (lente; si scelgono con -m stress, durata con STRESS_MINUTES)
addopts = -m "not stress" -p no:cacheprovider
filterwarnings =
    ignore::pytest.PytestConfigWarning
